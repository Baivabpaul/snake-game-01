
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-game"
version = "1.0.0"
description = "A professional Snake Game built with Python and Pygame"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
