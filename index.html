<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐍 Realistic Snake Pro</title>

  <!-- Open Graph & WhatsApp / MS Teams Rich Link Previews -->
  <meta property="og:title" content="🐍 Realistic Snake Pro - Play Now!">
  <meta property="og:description" content="Realistic snake slithering, 3D juicy apples, high scores, and smooth controls. Click to play directly in your browser!">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0f141a">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Quick Toolbar -->
  <header class="top-nav">
    <div class="nav-left">
      <span class="logo-badge">🐍 SNAKE <small>PRO</small></span>
    </div>
    <div class="nav-right">
      <button id="btn-sound" class="nav-btn" title="Toggle Sound">🔊 Audio: ON</button>
      <button id="btn-popup" class="nav-btn" title="Open in compact desktop-like window">🗗 Pop-out Window</button>
      <button id="btn-fullscreen" class="nav-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="game-wrapper">
    <div class="canvas-card">
      <canvas id="gameCanvas" width="1000" height="700"></canvas>
    </div>

    <!-- On-screen Virtual Controls for Mobile / Touch (WhatsApp users) -->
    <div class="mobile-controls" id="mobileControls">
      <div class="dpad">
        <button class="dpad-btn up" id="ctrl-up" aria-label="Up">▲</button>
        <div class="dpad-middle">
          <button class="dpad-btn left" id="ctrl-left" aria-label="Left">◀</button>
          <button class="dpad-btn center" id="ctrl-pause" aria-label="Pause">⏸</button>
          <button class="dpad-btn right" id="ctrl-right" aria-label="Right">▶</button>
        </div>
        <button class="dpad-btn down" id="ctrl-down" aria-label="Down">▼</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
